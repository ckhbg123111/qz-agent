spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qz_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.initializationFailTimeout=0

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

logging.pattern.level=%5p [traceId=%X{traceId}]
logging.level.root=INFO
logging.level.com.zhongjia=INFO
logging.file.path=${LOG_PATH:logs}
logging.file.max-history-days=${LOG_MAX_HISTORY_DAYS:30}
logging.file.max-size=${LOG_MAX_FILE_SIZE:100MB}
logging.file.total-size-cap=${LOG_TOTAL_SIZE_CAP:2GB}

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_REDIS_DATABASE:0}
spring.data.redis.timeout=3s

jwt.secret=${JWT_SECRET:change-me-please}
jwt.expire-seconds=${JWT_EXPIRE_SECONDS:3600}

wechat.message.base-url=${WECHAT_MESSAGE_BASE_URL:https://api.aiqikang.com}
wechat.message.path=${WECHAT_MESSAGE_PATH:/api/b2b/wechat/message}
wechat.message.app-key=${WECHAT_MESSAGE_APP_KEY:qzhospital}
wechat.message.app-secret=${WECHAT_MESSAGE_APP_SECRET:d98e2ab4fcd4d4e552b37ada2eb3b14e934a6a6b1e2570aea232ac4b228229c3}

wechat.push.wsdl-url=${WECHAT_PUSH_WSDL_URL:http://192.168.50.19/csp/hsb/DHC.Published.PUB0039.BS.PUB0039.CLS?WSDL=1}
wechat.push.endpoint-url=${WECHAT_PUSH_ENDPOINT_URL:http://192.168.50.19/csp/hsb/DHC.Published.PUB0039.BS.PUB0039.cls}
wechat.push.namespace=${WECHAT_PUSH_NAMESPACE:http://www.dhcc.com.cn}
wechat.push.service-name=${WECHAT_PUSH_SERVICE_NAME:PUB0039}
wechat.push.port-name=${WECHAT_PUSH_PORT_NAME:PUB0039Soap}
wechat.push.method-name=${WECHAT_PUSH_METHOD_NAME:HIPMessageServer}
wechat.push.soap-action=${WECHAT_PUSH_SOAP_ACTION:http://www.dhcc.com.cn/DHC.Published.PUB0039.BS.PUB0039.HIPMessageServer}
wechat.push.bizcode=${WECHAT_PUSH_BIZCODE:yytz}

push.task.zset-key=${PUSH_TASK_ZSET_KEY:wechat:push:task:delayed}
push.task.batch-size=${PUSH_TASK_BATCH_SIZE:100}
push.task.max-retry-count=${PUSH_TASK_MAX_RETRY_COUNT:5}
push.task.base-retry-delay-minutes=${PUSH_TASK_BASE_RETRY_DELAY_MINUTES:10}
push.task.test-mode=${PUSH_TASK_TEST_MODE:false}
push.task.report-delay-days=${PUSH_TASK_REPORT_DELAY_DAYS:2}
push.task.follow-up-delay-days=${PUSH_TASK_FOLLOW_UP_DELAY_DAYS:14}
push.task.trigger-hour=${PUSH_TASK_TRIGGER_HOUR:10}
push.task.report-delay-minutes-for-test=${PUSH_TASK_REPORT_DELAY_MINUTES_FOR_TEST:2}
push.task.follow-up-delay-minutes-for-test=${PUSH_TASK_FOLLOW_UP_DELAY_MINUTES_FOR_TEST:4}
push.task.consumer-fixed-delay-ms=${PUSH_TASK_CONSUMER_FIXED_DELAY_MS:5000}
push.task.compensation-fixed-delay-ms=${PUSH_TASK_COMPENSATION_FIXED_DELAY_MS:60000}
